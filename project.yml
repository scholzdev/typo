name: Typo
options:
  developmentLanguage: en
  deploymentTarget:
    macOS: "27.0"
packages:
  Typo:
    path: Packages/Typo
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.6.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Typo:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Support"]
      # Typo's built-in workflows: Contents/Resources/Workflows.
      - path: Workflows
        type: folder
        buildPhase: resources
    dependencies:
      - package: Typo
        products: [TypoKit, TypoAssistant, TypoACP, TypoMCP, ACPProtocol, MCPProtocol]
      # Linking this dynamic product makes Xcode build the TypstEngine target as TypstEngine.framework, which the app
      # and typo-mcp then share instead of each carrying the engine; the product itself is a small shim.
      - package: Typo
        product: TypstEngineDynamic
        embed: true
      - target: typo-mcp
        copy:
          destination: executables
      - package: Sparkle
    entitlements:
      path: App/Support/Typo.entitlements
      properties:
        com.apple.security.network.client: true
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: Typo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Typo"
        # Updates (App/Updates.swift): the appcast that release.sh writes, and the public half of its signing key.
        SUFeedURL: https://scholzdev.github.io/typo/appcast.xml
        SUPublicEDKey: 3Mg1P8okDsET8qxCLjM1cPRt5PMBLRVrzDwQXn/hhFg=
        SUEnableAutomaticChecks: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Typst Source
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [me.florianscholz.typo.typst-source]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: me.florianscholz.typo.typst-source
            UTTypeDescription: Typst Source
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [typ]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.florianscholz.typo
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        # Builds from Xcode keep their own settings, file associations and history beside an installed release.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: me.florianscholz.typo.debug
  typo-mcp:
    type: tool
    platform: macOS
    sources: [typo-mcp]
    dependencies:
      - package: Typo
        products: [TypoMCP, MCPProtocol, TypoKit, TypstEngineDynamic, JSONRPC]
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES    # embedded in Typo.app, never installed on its own
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"    # the app's TypstEngine.framework
