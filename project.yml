name: Typo
options:
  deploymentTarget:
    macOS: "27.0"
packages:
  Typo:
    path: Packages/Typo
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
targets:
  Typo:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Support"]
    dependencies:
      - package: Typo
        products: [TypoKit, TypoAssistant, TypoACP, TypoMCP, ACPProtocol, MCPProtocol]
      # Linking this dynamic product makes Xcode build the TypstEngine target as TypstEngine.framework, which the app
      # and typo-mcp then share instead of each carrying the engine; the product itself is a small shim.
      - package: Typo
        product: TypstEngineDynamic
        embed: true
      - target: typo-mcp
        copy:
          destination: executables
    entitlements:
      path: App/Support/Typo.entitlements
      properties:
        com.apple.security.network.client: true
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: Typo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Typo"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Typst Source
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [com.example.typst-source]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.example.typst-source
            UTTypeDescription: Typst Source
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [typ]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Tympan
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  typo-mcp:
    type: tool
    platform: macOS
    sources: [typo-mcp]
    dependencies:
      - package: Typo
        products: [TypoMCP, MCPProtocol, TypoKit, TypstEngineDynamic, JSONRPC]
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES    # embedded in Typo.app, never installed on its own
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"    # the app's TypstEngine.framework
