name: Feature request
description: Suggest something Typo should do.
labels: [enhancement, needs triage]
body:
  - type: markdown
    attributes:
      value: |
        Please search the existing issues first; a thumbs-up on an existing request helps more than a duplicate. Typo is built by one person, so not every good idea fits. A clear problem makes it much easier to decide.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: When I write my thesis, I have to … every time, because …
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Mention other editors that do it well, if you know one.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Workarounds you use now, if any.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself and send a pull request after we agree on the approach.
