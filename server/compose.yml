services:
  app:
    build: .
    restart: unless-stopped
    user: "1001:1001"
    environment:
      # Public half of ~/.config/tympan/license-signing.key (swift tools/license.swift pubkey).
      LICENSE_PUBLIC_KEY: "+l3xs/MXqJvbIQyNbfKHKdALN/Fy0iynzBb4uWK2Bwk="
    volumes:
      - ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
